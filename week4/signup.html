<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join the club</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html">Club Events</a>
    <nav>
      <a href="index.html">Events</a>
      <a href="index.html">About</a>
      <a href="signup.html">Join</a>
    </nav>
  </header>

<main>
  <h1>Join the club</h1>
  <form id="signup-form" novalidate>
    <label for="name">Name</label>
    <input id="name" name="name" type="text" required aria-describedby="name-error">
    <p id="name-error" class="error" role="alert"></p>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required aria-describedby="email-error">
    <p id="email-error" class="error" role="alert"></p>

    <button type="submit">Register</button>
    <p id="success" role="status"></p>
  </form>
</main>

  <footer>
    <p>© 2026 MIS 457 Club</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
